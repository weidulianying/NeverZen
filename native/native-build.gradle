def nativeDir         = project.file('native')
def nativeBuildDir    = new File(nativeDir, 'build')
def nativeOutDir      = new File(nativeDir, 'out')
def nativeBinDir      = new File(nativeDir, 'bin')
def zenJarStaged      = new File(nativeDir, 'zen.jar')
def distDir           = new File(project.buildDir, 'dist')

// Provider-based references for task inputs/outputs
