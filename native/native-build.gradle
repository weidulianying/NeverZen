// ---------------------------------------------------------------------------
// Helper functions
// ---------------------------------------------------------------------------

/**
 * Return the short (7-char) git revision of HEAD.
 * Respects OPENZEN_BUILD_REVISION (set by CI) so git is not required on PATH.
 * Returns null if unavailable.
 */
def gitShortRevision() {
    def envRev = System.getenv('OPENZEN_BUILD_REVISION')
    if (envRev && !envRev.allWhitespace) return envRev.trim().take(7)

    try {
        def proc = ['git', 'rev-parse', '--short=7', 'HEAD'].execute(
            null, project.rootDir)
        def stdout = new StringBuilder()
        proc.consumeProcessOutput(stdout, new StringBuilder())
        proc.waitForOrKill(2000)
        if (proc.exitValue() == 0) {
            def v = stdout.toString().trim()
            if (v) return v
        }
    } catch (Exception ignored) {}
    return null
}

/**
 * Locate upx.exe on PATH. Returns absolute path or null.
 */
def findUpx() {
    try {
        def proc = ['where', 'upx.exe'].execute()
        def stdout = new StringBuilder()
        proc.consumeProcessOutput(stdout, new StringBuilder())
        proc.waitForOrKill(3000)
        if (proc.exitValue() == 0) {
            def first = stdout.toString().readLines().find { it?.trim() }
            if (first) {
                def upxPath = first.trim()
                println "[NativeBuild] UPX: ${upxPath}"
                return upxPath
            }
        }
    } catch (Exception ignored) {}
    println "[NativeBuild] UPX: not found on PATH (optional)"
    return null
}

// ---------------------------------------------------------------------------
// Task: stageNativeJar
// ---------------------------------------------------------------------------
// Copies the obfuscated + reobfuscated mod jar to native/zen.jar so the CMake
// DLL build can embed it as an RCDATA resource (via openzen.rc).
//
// Uses proper task inputs/outputs for up-to-date checking — no
// outputs.upToDateWhen { false } workaround.  Compatible with Gradle 8.8+ / 9.x.

tasks.register('stageNativeJar') {
    group = 'openzen'
    description = 'Stage the obfuscated mod jar to native/zen.jar for DLL embedding.'

    dependsOn 'obfuscateClasses'

    // 输入：jar 任务的最终输出（已被 obfuscateClasses 修改）
    inputs.file(tasks.jar.archiveFile)
    // 输出：native/zen.jar
    outputs.file(project.file('native/zen.jar'))

    doLast {
        // 在 doLast 中安全地获取 Provider 的值
        def src = tasks.jar.archiveFile.get().asFile
        def dst = project.file('native/zen.jar')

        if (!src.exists()) {
            throw new GradleException(
                "[NativeBuild] stageNativeJar: source jar not found at ${src.absolutePath}")
        }

        // 删除旧文件，避免文件锁定问题
        if (dst.exists() && !dst.delete()) {
            throw new GradleException(
                "[NativeBuild] stageNativeJar: cannot delete existing ${dst.absolutePath}")
        }

        dst.parentFile.mkdirs()
        project.copy {
            from src
            into dst.parentFile
            rename { dst.name }
        }

        println "[NativeBuild] Staged jar: ${src.name} (${src.length()} bytes) → ${dst.absolutePath}"
    }
}

// ---------------------------------------------------------------------------
// Task: configureNative
// ---------------------------------------------------------------------------
// Runs CMake configure on the native sub-projects (DLL + Loader) inside the
// 'native/' source tree.  All paths are absolute.  The MSVC environment is
// fully captured from VsDevCmd.bat and injected so CMake, vcpkg, and the
// Visual Studio generator all see consistent compiler/SDK paths.
//
// No workingDir — every path on the command line is absolute.
// No cmd /c — uses Exec's native commandLine(List).

tasks.register('configureNative', Exec) {
    group = 'openzen'
    description = 'Run CMake configure on the native sub-projects (DLL + Loader).'

    dependsOn 'stageNativeJar'

    // Limit vcpkg parallelism on local dev machines; CI keeps full parallelism.
    if (System.getenv('GITHUB_ACTIONS') == null) {
        environment 'VCPKG_MAX_CONCURRENCY', '1'
    }

    doFirst {
        def tc = NativeToolchain.get()

        // --- Resolve all paths & tools ---
        def cmake   = tc.findCmake().absolutePath
        def vcpkg   = tc.findVcpkg()
        if (!vcpkg) {
            throw new GradleException(NativeToolchain.vcpkgMissingMessage())
        }
        def vcpkgToolchain = vcpkg.absolutePath +
            File.separator + 'scripts' +
            File.separator + 'buildsystems' +
            File.separator + 'vcpkg.cmake'

        def arch      = tc.resolveArchitecture(project)
        def rev       = gitShortRevision()
        def srcDir    = nativeDir.absolutePath
        def buildDir  = nativeBuildDir.absolutePath

        // ---- 检测 Ninja（使用 vcpkg 下载的版本） ----
        def ninjaPath = null
        if (vcpkg) {
            def ninjaCandidates = [
                new File(vcpkg, "downloads/tools/ninja-1.13.2-windows/ninja.exe"),
                new File(vcpkg, "downloads/tools/ninja-1.12.1-windows/ninja.exe"),
                new File(vcpkg, "downloads/tools/ninja-1.11.1-windows/ninja.exe")
            ]
            for (cand in ninjaCandidates) {
                if (cand.exists()) {
                    ninjaPath = cand.absolutePath
                    println "[NativeBuild] Ninja found: ${ninjaPath}"
                    break
                }
            }
        }
        if (!ninjaPath) {
            // 尝试从 PATH 中查找 ninja
            try {
                def proc = ['where', 'ninja'].execute()
                def out = new StringBuilder()
                proc.consumeProcessOutput(out, new StringBuilder())
                proc.waitForOrKill(2000)
                if (proc.exitValue() == 0) {
                    def line = out.toString().readLines().find { it.trim() }
                    if (line) {
                        ninjaPath = line.trim()
                        println "[NativeBuild] Ninja found in PATH: ${ninjaPath}"
                    }
                }
            } catch (Exception ignored) {}
        }
        if (!ninjaPath) {
            throw new GradleException(
                "[NativeBuild] Ninja not found. Please install Ninja or ensure vcpkg has downloaded it.\n" +
                "vcpkg usually places it under downloads/tools/ninja-*/ninja.exe")
        }

        // ---- 使用 Ninja 生成器 ----
        def generator = "Ninja"
        def platform = arch  // x64 or arm64

        // --- Capture full MSVC environment ---
        def vsEnv = tc.captureVsEnvironment(arch)
        vsEnv.each { k, v -> environment k, v }

        // ---- 重建干净的 PATH，避免非 ASCII 字符 ----
        def safePath = [] as List<String>

        // 1. MSVC bin 目录
        def vcToolsDir = vsEnv['VCToolsInstallDir']
        if (vcToolsDir) {
            def binDir = new File(vcToolsDir, "bin/HostX64/x64")
            if (binDir.exists()) safePath << binDir.absolutePath
        }

        // 2. Windows SDK bin 目录
        def sdkDir = vsEnv['WindowsSdkDir']
        def sdkVer = vsEnv['WindowsSDKVersion']
        if (sdkDir && sdkVer) {
            def sdkBin = new File(sdkDir, "bin/${sdkVer}x64")
            if (sdkBin.exists()) safePath << sdkBin.absolutePath
        }

        // 3. Git bin 目录
        def gitExe = tc.findGit()
        if (gitExe) {
            def gitBin = gitExe.parentFile
            if (gitBin.exists()) safePath << gitBin.absolutePath
        }

        // 4. 系统必需目录（保证基本命令可用）
        safePath << 'C:\\Windows\\System32'
        safePath << 'C:\\Windows'
        safePath << 'C:\\Windows\\System32\\Wbem'
        safePath << 'C:\\Windows\\System32\\WindowsPowerShell\\v1.0'
        safePath << 'C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319'

        // 5. 可选：MSBuild 路径（确保 MSBuild 可被找到）
        def msbuildPath = tc.findMsBuild()?.parentFile?.absolutePath
        if (msbuildPath) safePath << msbuildPath

        // 覆盖 PATH
        environment 'PATH', safePath.join(';')
        println "[NativeBuild] Rebuilt PATH (clean): ${safePath.join(';')}"

        // 从 vsEnv 中获取 cl.exe 路径（已在 captureVsEnvironment 中设置了 CC）
        def clPath = vsEnv['CC']
        if (!clPath) {
            throw new GradleException(
                "[NativeBuild] CC environment variable not set. cl.exe not found.")
        }
        // 将反斜杠替换为正斜杠，避免 CMake 转义问题
        def clPathNormalized = clPath.replace('\\', '/')

        // --- Clean stale CMake cache from a different generator ---
        tc.cleanStaleCache(nativeBuildDir, generator)

        // --- Diagnostic summary ---
        println "[NativeBuild] ========================================"
        println "[NativeBuild] CMake Configure"
        println "[NativeBuild] ========================================"
        println "[NativeBuild] CMake       : ${cmake}"
        println "[NativeBuild] Generator   : ${generator}"
        println "[NativeBuild] Arch        : ${arch}"
        println "[NativeBuild] Source Dir  : ${srcDir}"
        println "[NativeBuild] Build Dir   : ${buildDir}"
        println "[NativeBuild] vcpkg Root  : ${vcpkg.absolutePath}"
        println "[NativeBuild] vcpkg Triplet: x64-windows-static"
        println "[NativeBuild] Build Rev   : ${rev ?: '(unknown)'}"
        println "[NativeBuild] ========================================"

        // --- Build command-line (all absolute paths, no cmd /c) ---
        // Use string concatenation (+) instead of GString (${}) for Gradle 9 safety.
        def cmakeArgs = [
            cmake,
            "-G", generator,
            "-S", srcDir,
            "-B", buildDir,
            "-DCMAKE_MAKE_PROGRAM=" + ninjaPath,
            "-DCMAKE_TOOLCHAIN_FILE=" + vcpkgToolchain,
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static",
            "-DVCPKG_HOST_TRIPLET=x64-windows-static",
            "-DCMAKE_C_COMPILER=${clPathNormalized}",
            "-DCMAKE_CXX_COMPILER=${clPathNormalized}"
        ]

        if (rev) {
            cmakeArgs << "-DOPENZEN_BUILD_REVISION=" + rev
        }

        commandLine cmakeArgs
    }
}

// ---------------------------------------------------------------------------
// Task: buildNative
// ---------------------------------------------------------------------------
// Compiles OpenZen.dll and NeverZenLoader.exe using CMake --build (which
// invokes MSBuild under the hood with the Visual Studio generator).
//
// Local dev → serial build (--parallel 1, avoids Qt parallel-build flakes).
// CI        → all processors (--parallel, no job limit).

tasks.register('buildNative', Exec) {
    group = 'openzen'
    description = 'Compile OpenZen.dll and NeverZenLoader.exe (CMake --build).'

    dependsOn 'configureNative'

    doFirst {
        def tc = NativeToolchain.get()
        def cmake    = tc.findCmake().absolutePath
        def buildDir = nativeBuildDir.absolutePath
        def arch     = tc.resolveArchitecture(project)

        // Re-capture VS environment so buildNative can run standalone
        // (without configureNative in the same Gradle invocation).
        def vsEnv = tc.captureVsEnvironment(arch)
        vsEnv.each { k, v -> environment k, v }

        def isCI = System.getenv('GITHUB_ACTIONS') != null
        def buildType = 'Release'

        println "[NativeBuild] ========================================"
        println "[NativeBuild] CMake Build"
        println "[NativeBuild] ========================================"
        println "[NativeBuild] Build Dir   : ${buildDir}"
        println "[NativeBuild] Config      : ${buildType}"
        println "[NativeBuild] Mode        : ${isCI ? 'CI (all processors)' : 'local (serial)'}"
        println "[NativeBuild] ========================================"

        // Build command-line (all absolute paths)
        def buildArgs = [
            cmake,
            "--build", buildDir,
            "--config", buildType
        ]

        if (isCI) {
            // CI: use all available processors
            buildArgs << "--parallel"
        } else {
            // Local: serial build to avoid Qt MOC/UIC parallel-compilation flakes
            buildArgs << "--parallel" << "1"
        }

        commandLine buildArgs
    }
}

// ---------------------------------------------------------------------------
// Task: packageDist
// ---------------------------------------------------------------------------
// Collects NeverZenLoader.exe into build/dist/.
// OpenZen.dll is embedded inside the EXE as an RCDATA resource, so users
// only need to distribute a single file.

tasks.register('packageDist') {
    group = 'openzen'
    description = 'Collect the Loader EXE into build/dist for distribution.'

    dependsOn 'buildNative'

    // Lazy input: the loader EXE may not exist at configuration time.
    inputs.property('buildDir', nativeBuildDir.absolutePath)

    def loaderExe = project.layout.buildDirectory.file(
        'dist/NeverZenLoader.exe')

    outputs.file(loaderExe)

    doLast {
        def src = new File(nativeBuildDir,
            'loader' + File.separator +
            'NeverZenLoader.exe')

        if (!src.isFile()) {
            throw new GradleException(
                "[NativeBuild] packageDist: NeverZenLoader.exe not found at:\n" +
                "  ${src.absolutePath}\n\n" +
                "The CMake build may have failed. Check the build log above for errors.")
        }

        def dstDir = distDir
        dstDir.mkdirs()

        project.copy {
            from src
            into dstDir
        }

        def dst = new File(dstDir, src.name)
        println "[NativeBuild] Packaged: ${String.format('%,d', src.length())} bytes → ${dst.absolutePath}"
    }
}

// ---------------------------------------------------------------------------
// Task: upxCompress
// ---------------------------------------------------------------------------
// Optional: runs UPX --best --lzma on the packaged NeverZenLoader.exe.
// No-op (warning only) when upx is not on PATH.

tasks.register('upxCompress') {
    group = 'openzen'
    description = 'Run UPX --best --lzma on the packaged EXE (no-op without upx).'

    dependsOn 'packageDist'

    doLast {
        def exe = new File(distDir, 'NeverZenLoader.exe')
        if (!exe.isFile()) {
            throw new GradleException(
                "[NativeBuild] upxCompress: EXE not found at ${exe.absolutePath}")
        }

        def upx = findUpx()
        if (!upx) {
            project.logger.warn(
                "[NativeBuild] UPX not found on PATH — skipping compression.\n" +
                "Install from https://upx.github.io/ to enable.")
            return
        }

        def before = exe.length()
        project.exec {
            commandLine upx, '--best', '--lzma', exe.absolutePath
        }
        def after = exe.length()

        println "[NativeBuild] UPX: " +
            String.format("%,d", before) + " → " +
            String.format("%,d", after) + " bytes (" +
            String.format("%.1f", after * 100.0d / before) + "% of original)"
    }
}

// ---------------------------------------------------------------------------
// Task: dll (umbrella)
// ---------------------------------------------------------------------------
// Top-level entry point for the full native build pipeline:
//
//   obfuscateClasses → stageNativeJar → configureNative → buildNative → packageDist → upxCompress
//
// Run:  ./gradlew dll
// The output is build/dist/NeverZenLoader.exe

tasks.register('dll') {
    group = 'openzen'
    description = 'Build the native DLL + GUI Loader (→ build/dist/NeverZenLoader.exe).'
    dependsOn 'upxCompress'
}

// ---------------------------------------------------------------------------
// Task: cleanNative
// ---------------------------------------------------------------------------
// Removes ALL native build artifacts so the repository returns to a pristine
// state.  Wired into the root 'clean' task.

tasks.register('cleanNative', Delete) {
    group = 'openzen'
    description = 'Remove native/build/, native/out/, native/bin/, native/zen.jar, and build/dist/.'

    delete nativeBuildDir
    delete nativeOutDir
    delete nativeBinDir
    delete zenJarStaged
    delete distDir
}

// Wire cleanNative into the root project's clean lifecycle.
// Use tasks.named (lazy) — no afterEvaluate needed for Gradle 9 compatibility.
tasks.named('clean').configure {
    dependsOn 'cleanNative'
}

// ---------------------------------------------------------------------------
// Configuration-time diagnostics
// ---------------------------------------------------------------------------
// These run even on a dry-run (./gradlew tasks) so the developer can verify
// their environment without waiting for a full build.

println "[NativeBuild] ========================================"
println "[NativeBuild] NeverZen Native Build System"
println "[NativeBuild] ========================================"
println "[NativeBuild] Project    : ${project.rootDir.absolutePath}"
println "[NativeBuild] Build Dir  : ${project.buildDir.absolutePath}"
println "[NativeBuild] Native Dir : ${nativeDir.absolutePath}"

// These may throw if VS is not installed — that's intentional, it surfaces
// the problem at configuration time rather than deep in a build.
try {
    println "[NativeBuild] VS         : ${NativeToolchain.get().findVisualStudio().absolutePath}"
    println "[NativeBuild] CMake      : ${NativeToolchain.get().findCmake().absolutePath}"
    println "[NativeBuild] MSBuild    : ${NativeToolchain.get().findMsBuild()?.absolutePath ?: 'not found (optional)'}"
    println "[NativeBuild] vcpkg      : ${NativeToolchain.get().findVcpkg()?.absolutePath ?: 'NOT FOUND (install for dll builds)'}"
    println "[NativeBuild] Arch       : ${NativeToolchain.get().resolveArchitecture(project)}"
} catch (GradleException e) {
    println "[NativeBuild] WARNING: ${e.message}"
    println "[NativeBuild] Native tasks (dll, configureNative, buildNative) will fail."
    println "[NativeBuild] Java-only tasks (jar, build, runClient) are unaffected."
}
println "[NativeBuild] ========================================"
